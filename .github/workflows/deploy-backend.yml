name: Deploy Backend to Azure Container Apps
on:
  push:
    branches: [dev-chanidu]
    paths: ["azure/backend/**"]
  workflow_dispatch: {}
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build & push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/univolve-backend:${{ github.sha }} ./azure/backend
          docker tag ${{ secrets.ACR_NAME }}.azurecr.io/univolve-backend:${{ github.sha }} ${{ secrets.ACR_NAME }}.azurecr.io/univolve-backend:latest
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/univolve-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/univolve-backend:latest
      - name: Update Container App
        run: |
          az containerapp update \
            --name ca-backend-univolve-prod \
            --resource-group rg-univolve-prod \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/univolve-backend:${{ github.sha }}
