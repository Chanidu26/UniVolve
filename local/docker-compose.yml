version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms_password
      POSTGRES_DB: vmsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs these in filename order on FIRST init of an empty volume.
      # Interim wiring until Member 1's `npm run migrate` runner lands (Wave 0);
      # each new migration gets the next NN_ prefix here.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./db/migrations/002_attendance.sql:/docker-entrypoint-initdb.d/02_002_attendance.sql
      - ./db/migrations/004_notifications_certificates.sql:/docker-entrypoint-initdb.d/04_004_notifications_certificates.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vmsdb"]
      interval: 5s
      retries: 10

  mailhog:                      # local email testing UI at http://localhost:8025
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_USER: vms
      DB_PASSWORD: vms_password
      DB_NAME: vmsdb
      JWT_SECRET: local-dev-secret
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  volunteer-frontend:
    build:
      context: ./volunteer-frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin-frontend:
    build:
      context: ./admin-frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
