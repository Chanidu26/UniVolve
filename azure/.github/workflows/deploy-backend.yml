name: Deploy Backend to Azure Container Apps
on:
  push:
    branches: [main]
    paths: ["azure/backend/**"]
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build & push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/vms-backend:${{ github.sha }} ./azure/backend
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/vms-backend:${{ github.sha }}
      - name: Update Container App
        run: |
          az containerapp update \
            --name ca-backend-vms-prod \
            --resource-group rg-vms-prod \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/vms-backend:${{ github.sha }}
